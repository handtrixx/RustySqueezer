name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    # Build the Rust binary and run the compaction harness against it: needle
    # recall, determinism, compression ratio and the per-section budget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t local-compact-eval ./rust
      - run: docker run -d --name local-compact-eval -p 8000:8000 local-compact-eval
      - run: sleep 3 && curl -fsS http://localhost:8000/health
      - run: python3 eval/eval.py --url http://localhost:8000/v1

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: rust
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/local-compact:latest
            ghcr.io/${{ github.repository_owner }}/local-compact:${{ github.sha }}

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/local-compact:python
