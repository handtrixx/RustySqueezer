name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    # Build the Rust binary and run the compaction harness against it: needle
    # recall, determinism, compression ratio and the per-section budget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rustysqueezer-eval ./rust
      - run: docker run -d --name rustysqueezer-eval -p 8000:8000 rustysqueezer-eval
      - run: sleep 3 && curl -fsS http://localhost:8000/health
      - run: python3 eval/eval.py --url http://localhost:8000/v1

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve crate version
        run: echo "SQUEEZER_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml)" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: rust
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rustysqueezer:latest
            ghcr.io/${{ github.repository_owner }}/rustysqueezer:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rustysqueezer:${{ env.SQUEEZER_VERSION }}
            ghcr.io/${{ github.repository_owner }}/rustysqueezer:v${{ env.SQUEEZER_VERSION }}
      - name: Tag the release if this version is not yet tagged
        run: |
          if ! git ls-remote --tags origin "refs/tags/v${SQUEEZER_VERSION}" | grep -q .; then
            git tag "v${SQUEEZER_VERSION}"
            git push origin "v${SQUEEZER_VERSION}"
          fi
