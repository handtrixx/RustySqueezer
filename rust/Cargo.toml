[package]
name = "rustysqueezer"
version = "1.2.3"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# Small-model assist (map-reduce condensation of the key-points section) and
# forwarding mode may talk to HTTPS upstreams (Google, gateways): rustls-tls
# ships embedded webpki roots, so no system CA store is needed on scratch.
# HTTP/1.1 is reqwest's always-on baseline.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
