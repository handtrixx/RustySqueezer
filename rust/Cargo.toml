[package]
name = "rustysqueezer"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
strip = true
lto = true
