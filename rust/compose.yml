# rustysqueezer service (single Rust binary, negligible startup).
# Same env vars as .env.example; port 8000.
services:
  rustysqueezer:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: rustysqueezer
      MAX_SUMMARY_CHARS: "12000"
      TAIL_TURNS: "6"
      # Uncomment to let a small local model add generative highlights:
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
